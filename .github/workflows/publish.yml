name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for version change
        id: version
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          OLD_VERSION=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "Version changed: $OLD_VERSION -> $NEW_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($NEW_VERSION), skipping publish"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade npm for trusted publishing
        if: steps.version.outputs.changed == 'true'
        run: npm install -g npm@latest

      - name: Install ripgrep
        if: steps.version.outputs.changed == 'true'
        run: sudo apt-get install -y ripgrep

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.version.outputs.changed == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.version.outputs.changed == 'true'
        run: npm test

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance --access public

      # The Marketplace has no OIDC equivalent, so this half stays on a PAT and
      # is skipped until one is stored as the VSCE_PAT repository secret.
      - name: Check Marketplace credentials
        id: vsce
        if: steps.version.outputs.changed == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VSCE_PAT is not set — skipping the Marketplace publish"
          fi

      - name: Wait for the npm version to be servable
        if: steps.vsce.outputs.configured == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            if npm view "@elea.health/lat-lsp@${VERSION}" version >/dev/null 2>&1; then
              echo "@elea.health/lat-lsp@${VERSION} is on the registry"
              exit 0
            fi
            echo "waiting for @elea.health/lat-lsp@${VERSION} (attempt ${attempt}/20)"
            sleep 15
          done
          echo "@elea.health/lat-lsp@${VERSION} never appeared on the registry" >&2
          exit 1

      - name: Publish the extension to the Marketplace
        if: steps.vsce.outputs.configured == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npm --prefix vscode install
          npm --prefix vscode run publish

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
